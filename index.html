<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cake World</title>
<meta name="theme-color" content="#8E3B46">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#FBF5EF;--card:#fff;--ink:#2B1B17;--mut:#7A6A63;--pri:#8E3B46;--pri2:#F3E1DC;--line:#EADFD7;--ok:#2E7D4F;--okbg:#E4F3EA;--bad:#C0392B;--badbg:#FBE4E1;--warn:#9A6200;--warnbg:#FFF0D2;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:92px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:var(--pri);color:#fff;position:sticky;top:0;z-index:5}
header .who{font-weight:700;font-size:17px;line-height:1.2}
header .role{font-size:12.5px;opacity:.85}
.ghost{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:10px;padding:8px 12px;font-weight:600}
.bar{padding:12px 16px 4px;background:#fff;border-bottom:1px solid var(--line)}
.dates{display:flex;gap:8px;align-items:center}
.dates .nav{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:20px}
.dates input[type=date]{flex:1;min-width:0;height:44px;border:1px solid var(--line);border-radius:12px;padding:0 10px;background:#fff}
.dates .today{height:44px;border-radius:12px;border:1px solid var(--pri);background:var(--pri2);color:var(--pri);font-weight:600;padding:0 12px}
.dlabel{font-size:13.5px;color:var(--mut);margin:6px 2px 8px}
.mlabel{flex:1;text-align:center;font-weight:700;font-size:17px;height:44px;line-height:44px}
.modes{display:flex;gap:8px;padding:0 0 10px;overflow-x:auto}
.seg{display:flex;gap:8px;margin:12px 0 4px}
.seg label{flex:1;margin:0;position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:12px 8px;border:1.5px solid var(--line);border-radius:12px;font-weight:700;background:#fff}
.seg input:checked+span{background:var(--pri);border-color:var(--pri);color:#fff}
.subhead{margin:10px 2px 6px;font-size:12.5px;font-weight:700;color:var(--pri);text-transform:uppercase;letter-spacing:.04em}
.grand{display:flex;justify-content:space-between;padding:12px 0 2px;margin-top:6px;border-top:2px solid var(--ink);font-size:18px;font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}
.chip-b{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:600;white-space:nowrap}
.chip-b.on{background:var(--pri);border-color:var(--pri);color:#fff}
.shopfix{display:inline-block;margin:0 0 10px;padding:6px 14px;border-radius:999px;background:var(--pri2);color:var(--pri);font-weight:700}
main{padding:14px 16px}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:700;background:var(--pri2);color:var(--pri)}
.btn.primary{background:var(--pri);color:#fff}
.btn.big{width:100%;font-size:17px;padding:15px;margin-bottom:12px}
.btn.ok{background:var(--ok);color:#fff}
.btn.bad{background:var(--bad);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h4{margin:0 0 8px;font-size:15px;color:var(--mut);font-weight:600}
.shophead{display:flex;align-items:center;justify-content:space-between;margin:16px 2px 8px;font-weight:700}
.shophead small{color:var(--mut);font-weight:500}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.row .top{display:flex;align-items:center;gap:10px}
.row .grow{flex:1;min-width:0}
.row .qty{font-weight:700;font-size:19px;white-space:nowrap;text-align:right}
.row .qty small{font-weight:500;color:var(--mut);font-size:13px}
.lock{opacity:.55;font-size:15px}
.acts{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.muted{color:var(--mut);font-size:13px}
.icon{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;font-weight:600}
.icon.danger{color:var(--bad);border-color:#F0C7C2}
.link{border:1px dashed var(--mut);background:transparent;border-radius:10px;padding:7px 12px;color:var(--mut);font-weight:600}
.chip{display:inline-block;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:700}
.chip.wait{background:var(--warnbg);color:var(--warn)}
.chip.grey{background:#F1ECE8;color:var(--mut)}
.chip.okc{background:var(--okbg);color:var(--ok)}
.chip.badc{background:var(--badbg);color:var(--bad)}
.tot{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.tot>div:first-child{min-width:0;flex:1;overflow-wrap:anywhere}
.tot>.chip{flex:none}
.tot:first-of-type{border-top:0}
.tot .by{color:var(--mut);font-size:12.5px}
.tot b{white-space:normal}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
.note{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.note.view{background:#E8EEF8;color:#2F4B7C}
.fc{display:flex;gap:12px;align-items:center;border-radius:14px;padding:12px;margin-bottom:12px;border:1.5px solid var(--line);background:#fff;font-size:14px}
.fc .fcpct{font-size:26px;font-weight:800;min-width:74px;text-align:center}
.fc.red{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.fc.green{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.fc.none{background:#F1ECE8;color:var(--mut)}
.fc .muted{color:inherit;opacity:.85;margin-top:2px}
.sliprow{border:1.5px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px;background:#FFFCF9}
.sliprow label{margin:6px 0 3px;font-size:13px}
.sliptotal{position:sticky;bottom:0;background:#E8EEF8;color:#2F4B7C;border-radius:12px;padding:10px 12px;font-weight:700;margin:8px 0}
.mk{border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;background:#fff}
.mk h4{margin:0 0 8px}
.sp .line{display:flex;align-items:center;gap:12px}
.sp .nums{display:flex;gap:14px;margin-top:4px}
.sp .nums span{font-size:14px;color:var(--mut)}
.sp .nums b{color:var(--ink);font-size:18px}
.dot{width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex:none;border:3px solid}
.dot.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.dot.short{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.dot.excess{background:var(--warnbg);border-color:#D9961A;color:var(--warn)}
.dot.pending{background:#F1ECE8;border-color:#CFC4BC;color:var(--mut);font-size:11px}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav .in{display:flex;width:100%;max-width:560px}
nav button{flex:1;border:0;background:transparent;padding:9px 1px 8px;color:var(--mut);font-size:11.5px;font-weight:600;position:relative}
nav button .e{display:block;font-size:22px;line-height:1.1}
nav button.on{color:var(--pri)}
nav .badge{position:absolute;top:4px;left:calc(50% + 8px);background:var(--bad);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;line-height:18px;padding:0 5px}
.scrim{position:fixed;inset:0;background:rgba(30,15,10,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;background:#fff;border-radius:22px 22px 0 0;padding:10px 18px 22px;z-index:21;max-height:90vh;overflow:auto}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet h3{margin:0 0 12px;font-size:19px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 5px}
input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;background:#fff;min-height:46px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);border-color:var(--pri)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--bad);font-weight:600;font-size:14px;min-height:20px;margin:8px 0 4px}
.fixed{padding:12px;border-radius:12px;background:var(--pri2);font-weight:600}
.sheet .btn{width:100%;margin-top:6px}
.sheet .btn.sec{background:#F1ECE8;color:var(--ink)}
.preview{margin-top:10px;text-align:center;font-weight:700;min-height:26px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#2B1B17;color:#fff;padding:11px 18px;border-radius:999px;font-weight:600;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.login{max-width:420px;margin:0 auto;padding:36px 20px 40px;text-align:center}
.login .logo{font-size:54px}
.login h1{margin:4px 0 2px;font-size:26px}
.login p{margin:0 0 20px;color:var(--mut)}
.who-list{display:grid;gap:10px;margin-bottom:14px}
.who-list button{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:13px;text-align:left;font-weight:700}
.who-list button small{display:block;font-weight:500;color:var(--mut);font-size:12.5px}
.who-list button.on{border-color:var(--pri);background:var(--pri2)}
.login input{text-align:center;font-size:22px;letter-spacing:6px}
.hint{margin-top:16px;font-size:13px;color:var(--mut);background:#fff;border:1px dashed var(--line);border-radius:12px;padding:10px;text-align:left}
.proto{margin-top:14px;font-size:13px;background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 12px;text-align:left}
.log{font-size:13.5px;padding:8px 0;border-top:1px solid var(--line)}
.log:first-of-type{border-top:0}
.sync{font-variant-numeric:tabular-nums}
.loading{text-align:center;color:var(--mut);padding:18px 0;font-weight:600}
textarea{font-size:15px}
.ghost{white-space:nowrap}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.fcmini{display:inline-block;margin:0 0 10px;padding:5px 12px;border-radius:999px;font-size:13px;border:1px solid var(--line);background:#fff;font-weight:600}
.fcmini small{font-weight:500;opacity:.85}
.fcmini.red{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.fcmini.green{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.fcmini.none{background:#F1ECE8;color:var(--mut)}
.tickrow{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.tickrow:first-of-type{border-top:0}
.tickbox{width:44px;height:44px;border-radius:12px;border:2.5px solid #B9ADA5;background:#fff;font-size:26px;font-weight:800;color:#fff;flex:none;line-height:1}
.tickbox.on{background:var(--ok);border-color:var(--ok)}
.tq{font-size:24px;font-weight:800;white-space:nowrap}
.tq small{font-size:13px;font-weight:600;color:var(--mut)}
.psheet{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:8px}
.phead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:8px}
.phead h2{margin:0;font-size:21px}
.pbrand{font-size:12.5px;font-weight:700;color:var(--pri);letter-spacing:.04em;text-transform:uppercase}
.psec{margin:14px 0 4px;font-size:13px;font-weight:800;color:var(--pri);text-transform:uppercase;letter-spacing:.04em}
.psec.late{color:var(--warn)}
.ptab{width:100%;border-collapse:collapse;font-size:15.5px}
.ptab td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
.ptab td.n{text-align:right;font-weight:700;white-space:nowrap}
.ptab td.bx{width:26px}
.ptab tr.sub td{font-weight:800;border-top:2px solid var(--ink);border-bottom:0}
.box{display:inline-block;width:16px;height:16px;border:1.5px solid #555;border-radius:3px;vertical-align:middle}
.pgrand{display:flex;justify-content:space-between;gap:8px;margin-top:12px;padding-top:8px;border-top:2px solid var(--ink);font-weight:800;font-size:16px}
.pfoot{margin-top:14px;font-size:11.5px;color:var(--mut);text-align:center}
.pmeta{margin:2px 0 4px}
.ptitle{text-align:center;color:#1F3864;font-size:18px;font-weight:800;letter-spacing:.02em;margin:0 0 6px;padding-bottom:6px;border-bottom:3px solid #1F3864}
.pinfo{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13px;margin:4px 0 8px}
.pinfo .ln{display:inline-block;min-width:110px;border-bottom:1px solid #333;height:1em;vertical-align:bottom}
.pbar{background:#2B6CB0;color:#fff;font-weight:800;font-size:12.5px;padding:4px 8px;margin-top:10px;letter-spacing:.03em}
.pbar.late{background:var(--warn)}
.ptd{width:100%;border-collapse:collapse;font-size:13px}
.ptd th{background:#EEF1F6;color:#1F3864;font-size:10.5px;font-weight:700;padding:4px 3px;border:1px solid #A9B7CC;text-align:center}
.ptd td{border:1px solid #C5CFDD;padding:3px 4px;vertical-align:top}
.ptd td.c1{width:26px;text-align:center;font-weight:700}
.ptd td.c3{width:40px;text-align:center;font-weight:800}
.ptd td.c4{width:74px;text-align:center}
.ptd .rm{font-size:10.5px;color:#555;font-weight:600;line-height:1.2}
.ptd tr.hit td{background:#FFF8E1}
.ptd tr.out td{background:#FBD9D4!important}.ptd tr.out td.c4:nth-child(3){color:#B71C1C}
.psheet{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet .ws-row{display:flex;gap:6px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)}
.ws-n{flex:1;font-size:14.5px;font-weight:600;min-width:0;overflow-wrap:anywhere}
.sheet .ws-row input{width:76px;flex:none;padding:8px 6px;border:1px solid var(--line);border-radius:10px;font-size:15px;text-align:center;margin:0}
.sheet .ws-x{flex-wrap:wrap}.sheet .ws-x input{flex:1 1 40%;width:auto}.sheet .ws-x input:first-child{flex:1 1 100%;text-align:left}
.ws-u{border:0;cursor:pointer;font-family:inherit;font-size:11px;font-weight:700;color:var(--mut);background:#F3ECE6;border-radius:6px;padding:1px 6px;margin-left:4px;white-space:nowrap}.ws-head{display:flex;gap:6px;font-size:11px;font-weight:700;color:var(--mut);padding:8px 0 2px}.ws-head span:first-child{flex:1}.ws-head span:not(:first-child){width:76px;text-align:center}
.ws-save{position:sticky;bottom:-22px;background:#fff;padding:8px 0 4px}
.sheet #wsSearch{width:100%;margin-top:6px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font-size:15px}
.tot .chip{white-space:normal;text-align:right}
.tot>.chip,.tot>div:last-child{flex:none;max-width:60%}
.tickbox.dr{background:#8FC39B;border-color:#2F7D4A;border-style:dashed}
.cfm{margin:6px 0 2px;padding:9px 14px;font-size:15px;width:100%}
.tickbox.lk{display:flex;align-items:center;justify-content:center;opacity:.85}
.cntok{font-size:13px;font-weight:700;color:var(--ok)}
.tickbox.half{background:#F2A93B;border-color:#D98A12;font-size:22px}
.pendnote{font-size:13px;font-weight:700;color:#9A5B00}
.lessb{white-space:nowrap;font-size:12px;padding:6px 8px}
.ptd tr.dayrow td{background:#2B6CB0;color:#fff;font-weight:800;font-size:12px;letter-spacing:.04em;padding:4px 8px}
.ptd td.c4{min-width:66px}
.pgrand.tot2{font-size:18px;border-top:3px double var(--ink)}
.psheet .rm{font-size:11px;color:#555;font-weight:600;margin-top:4px}
.tpl{padding:7px 10px;border-radius:10px;margin:6px 0;font-size:14.5px}
.tpl.ok{background:var(--okbg)}
.tpl.pk{background:#FFF3D6}
.tpl.bd{background:var(--badbg);color:var(--bad)}
.tpl.dm{background:#FDE8E4}
.chip.dmgc{background:#C0392B;color:#fff}
.chip.newc{background:#E3EEFB;color:#1F3864}
.pbar.mod{background:#6B3FA0}
.pbar.oth{background:#2F855A}
.pbar.nte{background:#4A5568}
.pbar.dmgbar{background:#C0392B}
.ptd tr.dmg td{background:#FDECEA}
.ptd .rm.dm{color:#C0392B;font-weight:800}
.psheet.offscreen{display:none}
.rdy{color:#1E7B3A;font-weight:800}
.part{color:#B45309;font-weight:800;font-size:12px}
.ptd tr.okrow td{background:#EAF6EE}
.pgrand.sm{font-size:13px;margin-top:6px;padding-top:4px}
.tpsum{margin:8px 0 4px;font-weight:700}
.tpprev{margin:8px 0}
@page{size:A4;margin:9mm}
@media print{body.printing .psheet.offscreen.printing{display:block!important}.pbar,.ptd tr.okrow td,.ptd tr.dmg td,.ptd th,.ptd tr.hit td,.ptitle{-webkit-print-color-adjust:exact;print-color-adjust:exact}.ptd tr{page-break-inside:avoid}.pbar{page-break-after:avoid}.ptd{font-size:11.5px}.ptd td{padding:2px 4px}}
.ghost{position:relative}.dot{position:absolute;top:3px;right:3px;width:11px;height:11px;border-radius:50%;background:#FF5A4D;border:2px solid #8E3B46}
.chatwrap{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.chathead{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--pri);color:#fff}.chathead b{font-size:18px;flex:1}.chathead small{font-size:12px;opacity:.85;display:block;font-weight:400}
.chatlist{flex:1;overflow:auto;padding:12px 12px 6px;-webkit-overflow-scrolling:touch}
.cm{max-width:84%;margin:6px 0;padding:8px 11px;border-radius:14px;background:#fff;border:1px solid var(--line);word-wrap:break-word;overflow-wrap:anywhere}
.cm.me{margin-left:auto;background:var(--pri2);border-color:#E7C9C3}.cm .cn{font-size:12.5px;font-weight:700;color:var(--pri)}.cm .ct{font-size:11.5px;color:var(--mut);margin-top:3px;text-align:right}
.cm img{max-width:100%;max-height:260px;border-radius:10px;display:block;margin-top:4px}.cm audio{width:230px;max-width:100%;margin-top:4px}
.cday{text-align:center;font-size:12px;color:var(--mut);margin:10px 0 4px}
.chatbar{display:flex;gap:6px;align-items:flex-end;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
.chatbar textarea{flex:1;min-height:42px;max-height:110px;border:1px solid var(--line);border-radius:14px;padding:9px 12px;font:inherit;resize:none}
.chatbar button{border:0;border-radius:50%;width:44px;height:44px;font-size:20px;background:var(--pri2);flex:none}.chatbar button.send{background:var(--pri);color:#fff}.chatbar button.rec{background:#C0392B;color:#fff;width:auto;border-radius:22px;padding:0 14px;font-size:14px;font-weight:700}
@media print{#chat-root,#board-root{display:none!important}}
.bth{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 12px;background:#fff;border:1px solid var(--line);border-radius:12px;margin:6px 0;cursor:pointer}.bth small{display:block;color:var(--mut);font-size:12.5px;font-weight:400;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bgrp{font-weight:700;margin:14px 2px 2px;display:flex;justify-content:space-between;align-items:center;gap:8px}

<body>
<div id="app"></div>
<div id="sheet-root"></div><div id="chat-root"></div><div id="board-root"></div><div id="ana-root"></div>
<div id="toast"></div>

<script id="logic">
// ===== Rules: permissions, locking, approvals, short/excess — kept free of any screen code so they can be tested =====
const Logic = (function () {
  const SHOPS = ['YMR', 'NDD', 'Varkala'];
  const ROLE_LABEL = { master: 'Master — full access', shop: 'Icing — production, used, purchases, sponge', sales: 'Sales — order list, counter, Bakery requests', bakery: 'Bakery — requests from all shops', viewer: 'View only' };
  // Cake World menu: [name, price for 1 Kg, price for 500 gm]  (from the printed menu)
  const MENU = [
    { cat: 'Special Cakes', items: [['Chocolate Truffle', 1000, 550], ['White Truffle', 1000, 550], ['Special Vancho', 1060, 580], ['Double Chocolate', 1100, 600], ['Swiss Choco Honey', 1100, 600], ['Fudgenut', 1100, 600], ['Redbee', 1180, 640], ['Shiyano', 1200, 650], ['Silky Chocolate', 1200, 650], ['Tender Coconut', 1200, 650], ['Caramel Honey', 1200, 650], ['Caramel Almond', 1240, 670], ['Rich Chocolate', 1300, 700], ['Fresh Fruit Cake', 1300, 700], ['Choco Velvet', 1300, 700], ['Nutty Bubbly', 1300, 700], ['Rainbow Cake', 1360, 730], ['Galaxy Chocolate', 1360, 730], ['Dairy Milk Cake', 1400, 750], ['Kitkat Cake', 1400, 750], ['French Red Velvet', 1400, 750]] },
    { cat: 'Classic Cakes', items: [['White Forest', 690, 395], ['Black Forest', 690, 395], ['Classic Vanila', 780, 440], ['Swiss Chocolate', 800, 450], ['Mango Cake', 800, 450], ['Irish Coffee', 800, 450], ['Choco Chip', 840, 470], ['White Chip', 840, 470], ['Blueberry Cake', 840, 470], ['Vancho', 880, 490], ['Butterscotch', 900, 500], ['Honey Almond', 990, 545], ['Royal Butterscotch', 1050, 575], ['Red Velvet', 1080, 590], ['Caramel Truffle', 1120, 610]] },
    { cat: 'Premium Cakes', items: [['Filjaro', 1400, 750], ['Chocolate Symphony', 1500, 800], ['Tiramisu Chocolate', 1500, 800], ['Choco Lotus Crunchy', 1600, 850], ['Lotus Cake', 1660, 880], ['Rafaello', 1660, 880], ['Russian Honey Cake', 1660, 880], ['Ferrero Rocher', 1660, 880], ['Spanish Cake', 1700, 900], ['French Hazelnut', 1800, 950], ['Pistachio', 1980, 1040]] },
    { cat: 'Cheese & Mousse Cakes', items: [['Blueberry Cheese', 1260, 680], ['Chocolate Mousse', 1460, 780], ['Lotus Cheese', 1660, 880]] }
  ];
  const PRICES = {};
  MENU.forEach(g => g.items.forEach(i => { PRICES[i[0]] = [i[1], i[2]]; }));
  const pad = n => String(n).padStart(2, '0');
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parse(s) { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function addDays(s, n) { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); }
  function uid() {
    try { if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID(); } catch (e) { }
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });
  }
  function fail(m) { return { ok: false, error: m }; }
  function newState() { return { production: [], consumption: [], purchase: [], plan: [], sold: [], closing: [], sponge: [], items: [], requests: [], log: [], settings: { foodCostLimit: 30 } }; }
  function visibleShops(u) { return (u.role === 'shop' || u.role === 'sales') ? [u.shop] : SHOPS.slice(); }
  function canAdd(u, shop) {
    if (u.role === 'master') return SHOPS.includes(shop);
    if (u.role === 'shop') return u.shop === shop;
    return false;
  }
  function log(s, u, text) { s.log.unshift({ at: Date.now(), by: u.name, text: text }); if (s.log.length > 300) s.log.length = 300; }
  const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
  const KIND_NAME = { production: 'Production', consumption: 'Consumption', purchase: 'Purchase', plan: 'Order list', sold: 'Sale', closing: 'Closing' };
  const ENTRY_KINDS = ['production', 'consumption', 'purchase'];

  function addEntry(s, u, kind, d, today) {
    if (!ENTRY_KINDS.includes(kind)) return fail('Invalid type');
    if (!canAdd(u, d.shop)) return fail('You are not allowed to add entries for this shop');
    const item = String(d.item || '').trim().replace(/\s+/g, ' ');
    const qty = Number(d.qty);
    if (!item) return fail(kind === 'production' ? 'Choose a cake from the menu' : 'Enter the item name');
    if (!(qty > 0) || !isFinite(qty)) return fail(kind === 'production' ? 'Enter how many cakes (1 or more)' : 'Quantity must be greater than 0');
    if (!DATE_RE.test(d.date || '')) return fail('Date is not valid');
    if (u.role === 'shop' && d.date !== today) return fail('A shop can only add entries for today. For an older date, ask YMR');
    const e = { id: uid(), date: d.date, shop: d.shop, item: item, qty: qty, unit: d.unit || '', by: u.name, at: Date.now() };
    if (kind === 'production') {
      const pr = PRICES[item];
      if (!pr) return fail('Choose a cake from the menu — only menu cakes and model cakes are made');
      if (!Number.isInteger(qty)) return fail('Number of cakes must be a whole number');
      e.unit = 'pcs';
      if (d.model) {
        const w = Number(d.weight);
        if (!(w > 0) || !isFinite(w)) return fail('Enter the model cake weight in kg');
        e.model = true; e.flavor = item; e.item = 'Model · ' + item; e.weight = w;
      } else {
        const size = String(d.size || '').trim();
        if (size !== '1 Kg' && size !== '500 gm') return fail('Choose the size: 1 Kg or 500 gm');
        e.size = size; e.cake = item; e.item = item + ' (' + size + ')'; e.price = size === '1 Kg' ? pr[0] : pr[1];
      }
    }
    if (kind === 'production' && d.late && d.date === today) e.late = true;
    if (kind === 'purchase') {
      const amt = String(d.amount == null ? '' : d.amount).trim();
      if (amt !== '' && (!(Number(amt) >= 0) || !isFinite(Number(amt)))) return fail('Amount must be 0 or more');
      e.from = String(d.from || '').trim();
      e.amount = amt === '' ? null : Number(amt);
      e.outside = !!d.outside;
    }
    s[kind].push(e);
    log(s, u, KIND_NAME[kind] + ' added: ' + d.shop + ' · ' + e.item + (e.model ? ' ' + e.weight + ' kg' : '') + ' ' + qty + ' ' + e.unit + ' (' + d.date + ')' + (e.outside ? ' [outside purchase]' : ''));
    return { ok: true, entry: e };
  }

  function find(s, kind, id) { return (s[kind] || []).find(e => e.id === id); }
  function editEntry(s, u, kind, id, qty, amount) {
    if (u.role !== 'master') return fail('Only YMR can change an entry');
    const e = find(s, kind, id); if (!e) return fail('Entry not found');
    const q = Number(qty); if (!(q > 0) || !isFinite(q)) return fail('Quantity must be greater than 0');
    if (kind === 'purchase' && amount !== undefined) {
      const amt = String(amount).trim();
      if (amt !== '' && (!(Number(amt) >= 0) || !isFinite(Number(amt)))) return fail('Amount must be 0 or more');
      e.amount = amt === '' ? null : Number(amt);
    }
    const old = e.qty; e.qty = q;
    log(s, u, KIND_NAME[kind] + ' changed: ' + e.shop + ' · ' + e.item + ' ' + old + ' → ' + q);
    return { ok: true };
  }
  function deleteEntry(s, u, kind, id) {
    if (u.role !== 'master') return fail('Only YMR can delete. Send a delete request instead');
    const e = find(s, kind, id); if (!e) return fail('Entry not found');
    s[kind] = s[kind].filter(x => x.id !== id);
    s.requests.forEach(r => { if (r.kind === kind && r.refId === id && r.status === 'pending') { r.status = 'rejected'; r.resolvedBy = u.name; r.resolvedAt = Date.now(); } });
    log(s, u, KIND_NAME[kind] + ' deleted: ' + e.shop + ' · ' + e.item + ' ' + e.qty + ' (' + e.date + ')');
    return { ok: true };
  }
  function canRequestDelete(u, kind, e) {
    if (u.role === 'shop') return e.shop === u.shop && ENTRY_KINDS.includes(kind);
    if (u.role === 'sales') return kind === 'plan' && e.shop === u.shop;
    return false;
  }
  function requestDelete(s, u, kind, id, reason) {
    if (u.role === 'master') return fail('You are the master — delete it directly');
    if (!KIND_NAME[kind]) return fail('Invalid type');
    const e = find(s, kind, id); if (!e) return fail('Entry not found');
    if (!canRequestDelete(u, kind, e)) return fail(u.role === 'viewer' ? 'You only have view access' : 'You cannot request a delete for this entry');
    if (s.requests.some(r => r.status === 'pending' && r.kind === kind && r.refId === id)) return fail('A request for this entry has already been sent');
    const why = String(reason || '').trim();
    if (why.length < 3) return fail('Write a reason for deleting');
    const r = { id: uid(), kind: kind, refId: id, shop: e.shop, item: e.item, qty: e.qty, unit: e.unit, date: e.date, reason: why, by: u.name, byId: u.id, at: Date.now(), status: 'pending' };
    s.requests.unshift(r);
    log(s, u, 'Delete request: ' + KIND_NAME[kind] + ' · ' + e.shop + ' · ' + e.item + ' ' + e.qty + ' — ' + why);
    return { ok: true, request: r };
  }

  // ---- one cake line of the counter list (order + the cakes made for it) ----
  function planLineKey(e) { return e.shop + '|' + (e.other ? String(e.cake || e.item).toLowerCase() : e.cake) + '|' + e.size; }
  function prodLineKey(e) { return e.other ? e.shop + '|' + String(e.item || '').toLowerCase() + '|pcs' : e.model ? e.shop + '|' + e.flavor + '|' + (Math.round(e.weight * 1000) / 1000) + ' Kg' : e.shop + '|' + e.cake + '|' + e.size; }
  function lineKey(r) { return r.shop + '|' + (r.other ? String(r.cake).toLowerCase() : r.cake) + '|' + r.size; }
  function lineEntries(s, shop, date, key) {
    return { plans: s.plan.filter(e => e.date === date && e.shop === shop && planLineKey(e) === key), prods: s.production.filter(e => e.date === date && e.shop === shop && prodLineKey(e) === key) };
  }
  // YMR: mode 'made' = take back the cakes marked made (keep the order); 'all' = remove the order line and the made cakes
  function deleteCakeLine(s, u, d) {
    if (u.role !== 'master') return fail('Only YMR can do this');
    const x = lineEntries(s, d.shop, d.date, d.key);
    if (!x.plans.length && !x.prods.length) return fail('This line is already gone');
    if (d.mode === 'made') {
      if (!x.prods.length) return fail('Nothing is marked made for this line');
      const ids = x.prods.map(e => e.id), q = x.prods.reduce((a, e) => a + e.qty, 0);
      s.production = s.production.filter(e => ids.indexOf(e.id) < 0);
      log(s, u, 'Counter list fixed: ' + d.shop + ' · ' + (x.prods[0].item) + ' — removed ' + q + ' made (' + d.date + '), order kept');
      return { ok: true, removedMade: q, removedOrder: 0 };
    }
    const pi = x.plans.map(e => e.id), di = x.prods.map(e => e.id), po = x.plans.reduce((a, e) => a + e.qty, 0), pm = x.prods.reduce((a, e) => a + e.qty, 0);
    s.plan = s.plan.filter(e => pi.indexOf(e.id) < 0); s.production = s.production.filter(e => di.indexOf(e.id) < 0);
    log(s, u, 'Counter list line deleted: ' + d.shop + ' · ' + ((x.plans[0] || x.prods[0]).item) + ' — order ' + po + ', made ' + pm + ' (' + d.date + ')');
    return { ok: true, removedMade: pm, removedOrder: po };
  }
  // Icing / Sales: tell YMR what is wrong with a cake line (goes to YMR's delete requests; Approve removes the line)
  function reportLineMistake(s, u, d) {
    if (u.role !== 'shop' && u.role !== 'sales') return fail('Only Icing or Sales can send this');
    if (u.shop !== d.shop) return fail('This is not your shop');
    const why = String(d.text || '').trim(); if (why.length < 3) return fail('Write what the mistake is');
    if (why.length > 400) return fail('Please keep it shorter');
    const x = lineEntries(s, d.shop, d.date, d.key); if (!x.plans.length) return fail('This line is not on the counter list');
    const ref = x.plans[x.plans.length - 1];
    if (s.requests.some(r => r.status === 'pending' && r.kind === 'plan' && x.plans.some(p => p.id === r.refId))) return fail('A mistake note for this cake has already been sent');
    const q = x.plans.reduce((a, e) => a + e.qty, 0), made = x.prods.reduce((a, e) => a + e.qty, 0);
    const r = { id: uid(), kind: 'plan', refId: ref.id, shop: d.shop, item: ref.item, qty: q, unit: 'pcs', date: d.date, reason: '[Counter list] ' + why + ' (ordered ' + q + ', made ' + made + ')', by: u.name, byId: u.id, at: Date.now(), status: 'pending' };
    s.requests.unshift(r);
    log(s, u, 'Mistake note: ' + d.shop + ' · ' + ref.item + ' — ' + why);
    return { ok: true, request: r };
  }
  function resolveRequest(s, u, reqId, approve) {
    if (u.role !== 'master') return fail('Only YMR can approve');
    const r = s.requests.find(x => x.id === reqId);
    if (!r || r.status !== 'pending') return fail('Request not found or already handled');
    if (approve && r.kind === 'plan' && /^\[Counter list\]/.test(r.reason || '')) {
      const pe = s.plan.find(x => x.id === r.refId);
      if (pe) { const x = lineEntries(s, pe.shop, pe.date, planLineKey(pe)), pi = x.plans.map(e => e.id), di = x.prods.map(e => e.id); s.plan = s.plan.filter(e => pi.indexOf(e.id) < 0); s.production = s.production.filter(e => di.indexOf(e.id) < 0); }
      r.status = 'approved';
      log(s, u, 'Mistake note approved — line removed: ' + r.shop + ' · ' + r.item + ' (' + r.date + ')');
    } else if (approve) {
      s[r.kind] = s[r.kind].filter(x => x.id !== r.refId);
      r.status = 'approved';
      log(s, u, 'Delete approved: ' + r.shop + ' · ' + r.item + ' ' + r.qty + ' (' + r.date + ')');
    } else {
      r.status = 'rejected';
      log(s, u, 'Delete request rejected: ' + r.shop + ' · ' + r.item);
    }
    r.resolvedBy = u.name; r.resolvedAt = Date.now();
    return { ok: true };
  }
  function pendingRequests(s) { return s.requests.filter(r => r.status === 'pending'); }

  // --- Order list (sales), counter confirmation, sales, reconciliation ---
  function menuLine(d) {
    const item = String(d.item || '').trim(); const pr = PRICES[item];
    if (!pr) return { err: 'Choose a cake from the menu' };
    const size = String(d.size || '').trim();
    if (size !== '1 Kg' && size !== '500 gm') return { err: 'Choose the size: 1 Kg or 500 gm' };
    const qty = Number(d.qty);
    if (!Number.isInteger(qty) || qty <= 0) return { err: 'Enter how many cakes (a whole number, 1 or more)' };
    return { item: item, size: size, qty: qty };
  }
  function modelLine(d) {
    const item = String(d.item || '').trim();
    if (!PRICES[item]) return { err: 'Choose a cake from the menu' };
    const w = Number(d.weight);
    if (!(w > 0) || w > 25 || !isFinite(w)) return { err: 'Check the size (kg)' };
    const qty = Number(d.qty);
    if (!Number.isInteger(qty) || qty <= 0) return { err: 'Enter how many cakes (a whole number, 1 or more)' };
    return { item: item, size: (Math.round(w * 1000) / 1000) + ' Kg', qty: qty, model: true, weight: w };
  }
  function otherLine(d) {
    const item = String(d.item || '').trim().replace(/\s+/g, ' ');
    if (item.length < 2) return { err: 'Write the item name' };
    if (item.length > 40) return { err: 'The item name is too long' };
    const qty = Number(d.qty);
    if (!Number.isInteger(qty) || qty <= 0 || qty > 500) return { err: 'Enter how many (a whole number, 1 to 500)' };
    const pr = d.price == null || d.price === '' ? 0 : Number(d.price);
    if (!(pr >= 0) || pr > 100000 || !isFinite(pr)) return { err: 'Check the price' };
    return { item: item, size: 'pcs', qty: qty, other: true, price: pr };
  }
  function placePlan(s, u, d, today) {
    if (u.role !== 'sales' && u.role !== 'master') return fail('Only Sales or YMR can add the order list');
    if (!SHOPS.includes(d.shop)) return fail('Choose a shop');
    if (u.role === 'sales' && u.shop !== d.shop) return fail('You can only add the order list for your own shop');
    if (!DATE_RE.test(d.date || '')) return fail('Date is not valid');
    if (u.role === 'sales' && d.date < today) return fail('The order list cannot be added for a past date');
    const m = menuLine(d); if (m.err) return fail(m.err);
    const e = { id: uid(), date: d.date, shop: d.shop, cake: m.item, size: m.size, item: m.item + ' (' + m.size + ')', qty: m.qty, unit: 'pcs', by: u.name, at: Date.now() };
    s.plan.push(e);
    log(s, u, 'Order list: ' + d.shop + ' · ' + e.item + ' ' + e.qty + ' (for ' + d.date + ')');
    return { ok: true, entry: e };
  }
  // One slip with many cakes: all lines are checked first, then saved together (all or nothing)
  function placePlanBatch(s, u, d, today) {
    if (u.role !== 'sales' && u.role !== 'master') return fail('Only Sales or YMR can add the order list');
    if (!SHOPS.includes(d.shop)) return fail('Choose a shop');
    if (u.role === 'sales' && u.shop !== d.shop) return fail('You can only add the order list for your own shop');
    if (!DATE_RE.test(d.date || '')) return fail('Date is not valid');
    if (u.role === 'sales' && d.date < today) return fail('The order list cannot be added for a past date');
    const lines = Array.isArray(d.lines) ? d.lines : [];
    if (!lines.length) return fail('Add at least one cake');
    const merged = new Map();
    for (let i = 0; i < lines.length; i++) {
      const m = lines[i].other ? otherLine(lines[i]) : lines[i].model ? modelLine(lines[i]) : menuLine(lines[i]);
      if (m.err) return fail((lines[i].row ? 'Row ' + lines[i].row + ': ' : '') + m.err);
      const k = m.item.toLowerCase() + '|' + m.size;
      if (merged.has(k)) merged.get(k).qty += m.qty; else merged.set(k, m);
    }
    const entries = []; let cakes = 0;
    merged.forEach(m => {
      const e = { id: uid(), date: d.date, shop: d.shop, cake: m.item, size: m.size, item: m.item + ' (' + m.size + ')', qty: m.qty, unit: 'pcs', by: u.name, at: Date.now() };
      if (m.model) { e.model = true; e.weight = m.weight; e.flavor = m.item; }
      if (m.other) { e.other = true; e.item = m.item; if (m.price) e.price = m.price; }
      entries.push(e); cakes += m.qty;
    });
    entries.forEach(e => s.plan.push(e));
    log(s, u, 'Order list: ' + d.shop + ' · ' + entries.length + (entries.length === 1 ? ' line, ' : ' lines, ') + cakes + ' cakes (for ' + d.date + ')');
    return { ok: true, entries: entries, cakes: cakes };
  }
  // What was ordered vs what the kitchen has marked made, per shop + cake + size, for one day
  function orderStatus(s, shops, date) {
    const m = new Map();
    s.plan.filter(e => e.date === date && shops.includes(e.shop)).forEach(e => {
      const k = e.shop + '|' + (e.other ? e.cake.toLowerCase() : e.cake) + '|' + e.size;
      if (!m.has(k)) m.set(k, { shop: e.shop, cake: e.cake, size: e.size, item: e.other ? e.cake : e.cake + ' (' + e.size + ')', ordered: 0, made: 0, lastAt: 0, lastBy: '', model: !!e.model, weight: e.weight || 0, other: !!e.other, price: e.price || 0 });
      m.get(k).ordered += e.qty;
    });
    s.production.filter(e => e.date === date && shops.includes(e.shop)).forEach(e => {
      const r = e.other ? m.get(e.shop + '|' + String(e.item || '').toLowerCase() + '|pcs') : e.model ? m.get(e.shop + '|' + e.flavor + '|' + (Math.round(e.weight * 1000) / 1000) + ' Kg') : m.get(e.shop + '|' + e.cake + '|' + e.size); if (!r) return;
      r.made += e.qty; if (e.at >= r.lastAt) { r.lastAt = e.at; r.lastBy = e.by; }
    });
    const rank = { waiting: 0, partial: 1, extra: 2, ready: 3 };
    return Array.from(m.values()).map(r => Object.assign({}, r, { remaining: Math.max(0, r.ordered - r.made), state: r.made === 0 ? 'waiting' : r.made < r.ordered ? 'partial' : r.made === r.ordered ? 'ready' : 'extra' }))
      .sort((a, b) => SHOPS.indexOf(a.shop) - SHOPS.indexOf(b.shop) || rank[a.state] - rank[b.state] || a.item.localeCompare(b.item));
  }
  // "Ready" on an ordered cake = a production entry for that cake (same rules as adding production)
  function markReady(s, u, d, today) {
    const r = orderStatus(s, [d.shop], d.date).find(x => x.cake === d.cake && x.size === d.size);
    if (!r) return fail('This cake is not in the order list for this shop and date');
    if (r.other) {
      if (!canAdd(u, d.shop)) return fail('You are not allowed to add entries for this shop');
      if (u.role === 'shop' && d.date !== today) return fail('A shop can only add entries for today. For an older date, ask YMR');

  // --- Sponge orders ---
  function placeSponge(s, u, d, today) {

    s.sponge.push(o);

  function correctReceived(s, u, id, qty) {

  // --- Free-text requests from Sales to the Bakery, and the Bakery's Ready ---

  // --- Sponge slip: 4 sponge types x 3 sizes, ordered a day before, locked once saved ---

  function placeSpongeBatch(s, u, d, today) {

  // Confirm = the Bakery is sure. After this the line is locked (only YMR can undo).

  // ---------- Devices (YMR only) ----------

          (d.id === mine ? '' : d.revoked ? '<span class="chip grey">logging out…</span> <button class="btn sec" style="width:auto;padding:8px 12px" data-act="devrm" data-id="' + esc(d.id) + '">Remove</button>' : '<button class="btn bad" style="width:auto;padding:8px 12px" data-act="devout" data-id="' + esc(d.id) + '">Log out</button>') + '</div>';

  // ---------- Production list in the "Daily Cake Closing & Production Log" layout ----------
  const SZ_LAB = e => e.size === '500 gm' ? '½ kg' : e.size === '1 Kg' ? '1 kg' : (e.weight ? fmt(e.weight) + ' kg' : '');
  function prodMap(list) {
    const m = {};
    list.forEach(e => {
      if (e.other) return;
      const name = e.model ? e.flavor : e.cake; if (!name) return;
      const r = m[name] || (m[name] = { half: 0, one: 0, models: [], amt: 0 });
      if (e.model) { r.models.push({ w: e.weight, q: e.qty }); r.amt += e.qty * (e.charge || 0); } else { if (e.size === '500 gm') r.half += e.qty; else r.one += e.qty; r.amt += e.qty * (e.price || 0); }
    });
    return m;
  }
  function modelRemark(r) {
    const g = new Map(); r.models.forEach(x => g.set(x.w, (g.get(x.w) || 0) + x.q));
    return Array.from(g.keys()).sort((a, b) => a - b).map(w => fmt(w) + ' kg ×' + g.get(w)).join(', ');
  }
  function dmgMap(list) {
    const m = {};
    list.forEach(e => { if (!e.damage) return; const k = e.item || e.cake; if (!k) return; (m[k] || (m[k] = [])).push(e); });
    return m;
  }
  function dmgNote(arr) { return arr ? '<div class="rm dm">⚠ damage ' + arr.map(e => e.qty + (SZ_LAB(e) ? ' (' + SZ_LAB(e) + ')' : '')).join(', ') + '</div>' : ''; }
  const P_HEAD = '<thead><tr><th>#</th><th>CAKE NAME / FLAVOR</th><th>½ KG</th><th>1 KG</th><th>TOTAL / REMARKS</th><th>AMOUNT ₹</th></tr></thead>';
  function prodTable(list, onlyUsed, dm) {
    const m = prodMap(list), t = { half: 0, one: 0, models: 0, kg: 0, amt: 0 };
    dm = dm || {};
    let n = 0, html = '';
    L.SHEET.forEach((g, gi) => {
      let rows = '';
      g.items.forEach(name => {
        n++; const r = m[name], used = !!r && (r.half || r.one || r.models.length), dd = dm[name];
        if (r) { t.amt += r.amt; t.half += r.half; t.one += r.one; r.models.forEach(x => { t.models += x.q; t.kg += x.q * x.w; }); t.kg += r.half * 0.5 + r.one; }
        if (onlyUsed && !used && !dd) return;
        const disp = L.SHEET_ALIAS[name] || name;
        let tot = '';
        if (used) { const pcs = r.half + r.one + r.models.reduce((a, x) => a + x.q, 0); tot = '<b>' + pcs + '</b>' + (r.models.length ? '<div class="rm">model · ' + esc(modelRemark(r)) + '</div>' : ''); }
        tot += dmgNote(dd);
        rows += '<tr' + (used || dd ? ' class="hit"' : '') + '><td class="c1">' + n + '</td><td>' + esc(disp) + '</td><td class="c3">' + (used && r.half ? r.half : '') + '</td><td class="c3">' + (used && r.one ? r.one : '') + '</td><td class="c4">' + tot + '</td><td class="c4">' + (used && r.amt ? money(r.amt) : '') + '</td></tr>';
      });

    });

  // items that are not on the menu (donut, muffin, pastry ...): one row each, numbered after the menu
  function otherRows(list, dm, startN) {
    const g = new Map();
    list.filter(e => e.other).forEach(e => {
      const k = e.item.toLowerCase(), r = g.get(k) || { name: e.item, half: 0, one: 0, qty: 0, amt: 0, rm: new Map() };
      r.qty += e.qty; r.amt += e.qty * (e.price || 0);
      if (e.size === '500 gm') r.half += e.qty; else if (e.size === '1 Kg') r.one += e.qty; else if (e.weight) r.rm.set(e.weight, (r.rm.get(e.weight) || 0) + e.qty);
      g.set(k, r);
    });
    Object.keys(dm || {}).forEach(k => { if (!g.has(k.toLowerCase()) && dm[k].some(e => e.other)) g.set(k.toLowerCase(), { name: k, half: 0, one: 0, qty: 0, amt: 0, rm: new Map() }); });

      n++; pcs += r.qty; amt += r.amt;
      const rm = Array.from(r.rm.keys()).sort((a, b) => a - b).map(w => fmt(w) + ' kg ×' + r.rm.get(w)).join(', ');
      rows += '<tr class="hit"><td class="c1">' + n + '</td><td>' + esc(r.name) + '</td><td class="c3">' + (r.half || '') + '</td><td class="c3">' + (r.one || '') + '</td><td class="c4">' + (r.qty ? '<b>' + r.qty + '</b>' : '') + (rm ? '<div class="rm">' + esc(rm) + '</div>' : '') + dmgNote(dm && dm[r.name]) + '</td><td class="c4">' + (r.amt ? money(r.amt) : '') + '</td></tr>';

  function modelBlock(list) {

  function productionSheet(shop) {

  }
  function togglePtype(v) {
    const a = $('#menuBlock'), b = $('#modelBlock');
    if (a) a.style.display = v === 'model' ? 'none' : '';
    if (b) b.style.display = v === 'model' ? '' : 'none';
  }
  document.addEventListener('change', function (ev) {
    const t = ev.target; if (!t) return;
    if (t.id === 'datePick' && /^\d{4}-\d{2}-\d{2}$/.test(t.value)) { date = t.value; render(); }
    else if (t.id === 'cakeSel' || t.id === 'sizeSel') updatePrice();
    else if (t.name === 'f_ptype') togglePtype(t.value);
  });

  document.addEventListener('input', function (ev) {
    { const w0 = ev.target; if (w0 && w0.form && w0.form.dataset && w0.form.dataset.form === 'wsheet') wsSaveDraft(w0.form); }
    { const w = ev.target; if (w && w.id === 'wsSearch') { const q = String(w.value || '').trim().toLowerCase(); try { Array.prototype.forEach.call(document.querySelectorAll('#wsRows .ws-row'), n => { n.style.display = (!q || (n.getAttribute('data-n') || '').indexOf(q) >= 0) ? '' : 'none'; }); } catch (e) { } return; } }
    const t = ev.target; if (!t || !t.dataset) return;
    if (t.dataset.typed !== undefined) { tpRender(); return; }
    if (t.dataset.slip !== undefined) { updateSlipTotal(); return; }
    if (t.dataset.spslip !== undefined) { const box = $('#spTotal'); if (box && document.querySelectorAll) { let n = 0; Array.prototype.forEach.call(document.querySelectorAll('[data-spslip]'), x => { n += Number(x.value) || 0; }); box.textContent = 'Total: ' + n + ' sponges'; } return; }
    if (t.dataset.ordered === undefined) return;
    const box = $('#prev'); if (!box) return;
    if (String(t.value).trim() === '') { box.textContent = ''; box.style.color = ''; return; }
    const d = Number(t.value) - Number(t.dataset.ordered);
    if (d < 0) { box.textContent = '⚠ ' + Math.abs(d) + ' short'; box.style.color = '#C0392B'; }
    else if (d > 0) { box.textContent = '▲ ' + d + ' extra'; box.style.color = '#9A6200'; }
    else { box.textContent = '✓ Complete'; box.style.color = '#2E7D4F'; }
  });

  // ---------- Submit ----------
  document.addEventListener('submit', function (ev) {
    ev.preventDefault();
    const f = ev.target.closest ? ev.target.closest('form[data-form]') : null; if (!f) return;
    const kind = f.dataset.form, k = f.dataset.kind, id = f.dataset.id;
    const showErr = m => { const b = $('#ferr'); if (b) b.textContent = m; else toast(m); };
    let r;
    if (kind === 'login') { doLogin(val(f, 'pin')); return; }
    if (kind === 'setup') { doSetup(f); return; }
    if (kind === 'devout') { doDevOut(val(f, 'id')); return; }
    if (kind === 'inew') {
      r = L.placeItem(S, me, { shop: val(f, 'shop'), item: val(f, 'item'), qty: val(f, 'qty'), unit: val(f, 'unit'), forDate: val(f, 'date'), note: val(f, 'note') }, today());
      if (!r.ok) return showErr(r.error);
      tab = 'bakery'; if (me.role !== 'sales') { tab = 'sponge'; date = r.order.forDate; }
      save(); closeSheet(); toast('Sent to Bakery 🍰'); render(); return;
    }
    if (kind === 'bgive') {
      const o4 = S.sponge.concat(S.items).find(x => x.id === id), lk4 = (o4 && o4.lockQty) || 0, tv = String(val(f, 'qty')).trim();
      if (lk4 > 0 && tv !== '' && Number(tv) > o4.ordered - lk4) return showErr('You can give at most ' + fmt(o4.ordered - lk4) + ' more');
      r = L.setBakeryGiven(S, me, id, tv === '' || isNaN(Number(tv)) ? tv : String(lk4 + Number(tv)));
      if (!r.ok) return showErr(r.error);
      save(); closeSheet(); toast(r.state === 'full' ? '✓ All ready — the shop can see it' : r.state === 'partial' ? '✓ Saved — ' + fmt(r.pending) + ' pending, the shop can see it' : 'Saved — nothing ready yet'); render(); return;
    }
    if (kind === 'bready') {
      r = L.markBakeryReady(S, me, id);
      if (!r.ok) return showErr(r.error);
      save(); closeSheet(); toast('✓ Marked Ready — the shop can see it'); render(); return;
    }
    if (kind === 'add') {
      const model = k === 'production' && val(f, 'ptype') === 'model';
      r = L.addEntry(S, me, k, { shop: val(f, 'shop'), date: val(f, 'date'), item: k === 'production' ? (model ? val(f, 'mcake') : val(f, 'cake')) : val(f, 'item'), size: model ? '' : val(f, 'size'), model: model, weight: val(f, 'weight'), qty: model ? (val(f, 'count') || 1) : val(f, 'qty'), unit: val(f, 'unit'), from: val(f, 'from'), amount: val(f, 'amount'), outside: val(f, 'outside') === '1', late: k === 'production' && new Date().getHours() >= L.CUTOFF_HOUR }, today());
      if (!r.ok) return showErr(r.error);
      date = r.entry.date; tab = k; mode = 'day'; lastShop = r.entry.shop; finish(ev, () => addSheet(k), nextRequested(ev) ? 'Saved 🔒 — add the next one' : 'Saved 🔒'); return;
    }
    if (kind === 'mcharge') {
      if (!pendingProd) { closeSheet(); return; }
      for (let i = 0; i < pendingProd.ls.length; i++) { const v = String(val(f, 'mc' + i) == null ? '' : val(f, 'mc' + i)).trim(); if (v !== '') { if (!(Number(v) > 0 && Number(v) <= 100000)) return showErr('Check the charge you typed'); pendingProd.ls[i].charge = Number(v); } }
      return saveTypedProd(pendingProd, showErr);
    }
    if (kind === 'typed') {
      const ls = tpParse();
      if (!ls.length) return showErr('Type at least one cake, with its size');
      if (ls.some(x => x.state !== 'ok')) return showErr('Fix the lines marked ⚠ or ❌ first');
      if (k === 'sponge') {
        const m2 = new Map(); ls.forEach(x => m2.set(x.type, (m2.get(x.type) || 0) + x.qty));
        r = (me.role === 'sales' || (me.role === 'master' && ls.some(x => x.special)) ? L.placeSpongeItems : L.placeSpongeBatch)(S, me, { shop: val(f, 'shop'), forDate: val(f, 'date'), lines: Array.from(m2.keys()).map(t2 => ({ type: t2, ordered: m2.get(t2) })) }, today());
        if (!r.ok) return showErr(r.error);
        date = r.orders[0].forDate; tab = me.role === 'sales' ? 'bakery' : 'sponge'; save(); closeSheet(); toast('Order locked 🔒 — ' + r.total + ' sponges'); render(); return;
      }
      if (k === 'plan') {
        r = L.placePlanBatch(S, me, { shop: val(f, 'shop'), date: val(f, 'date'), lines: ls.map((x, i) => ({ item: x.cake, size: x.size, qty: x.qty, model: !!x.model, weight: x.weight, other: !!x.other, price: x.price, row: i + 1 })) }, today());
        if (!r.ok) return showErr(r.error);
        date = r.entries[0].date; lastShop = r.entries[0].shop; tab = me.role === 'sales' ? 'counter' : 'production'; mode = 'day';
        save(); closeSheet(); toast('Order list saved 🔒 — ' + r.cakes + (r.cakes === 1 ? ' cake' : ' cakes')); render(); return;
      }
      const pp = { shop: val(f, 'shop'), date: val(f, 'date'), ls: ls };
      if (ls.some(x => x.model && !x.other && !x.damage && !(x.charge > 0))) return askModelCharge(pp);
      return saveTypedProd(pp, showErr);
    }
    if (kind === 'plan') {
      const lines = [];
      for (let i = 0; i < slipN; i++) {
        const c = val(f, 'cake' + i), a = String(val(f, 'k' + i)).trim(), b = String(val(f, 'h' + i)).trim();
        if (!c && !a && !b) continue;
        if (!c) return showErr('Row ' + (i + 1) + ': choose a cake');
        if (!a && !b) return showErr('Row ' + (i + 1) + ': enter how many (1 Kg or 500 gm)');
        if (a) lines.push({ item: c, size: '1 Kg', qty: a, row: i + 1 });
        if (b) lines.push({ item: c, size: '500 gm', qty: b, row: i + 1 });
      }
      r = L.placePlanBatch(S, me, { shop: val(f, 'shop'), date: val(f, 'date'), lines: lines }, today());
      if (!r.ok) return showErr(r.error);
      date = r.entries[0].date; lastShop = r.entries[0].shop; tab = me.role === 'sales' ? 'counter' : 'production'; mode = 'day';
      save(); closeSheet(); toast('Order list saved 🔒 — ' + r.cakes + (r.cakes === 1 ? ' cake' : ' cakes')); render(); return;
    }
    if (kind === 'ready') {
      r = L.markReady(S, me, { shop: f.dataset.shop, date: date, cake: f.dataset.cake, size: f.dataset.size, qty: val(f, 'qty'), late: new Date().getHours() >= L.CUTOFF_HOUR }, today());
      if (!r.ok) return showErr(r.error);
      save(); closeSheet(); toast('✓ Marked ready — Sales can see it'); render(); return;
    }
    if (kind === 'sold') {
      r = L.addSold(S, me, { shop: val(f, 'shop'), date: val(f, 'date'), item: val(f, 'cake'), size: val(f, 'size'), qty: val(f, 'qty') }, today());
      if (!r.ok) return showErr(r.error);
      date = r.entry.date; lastShop = r.entry.shop; tab = 'production'; mode = 'stock';
      finish(ev, soldSheet, nextRequested(ev) ? 'Sale saved 🔒 — add the next one' : 'Sale saved 🔒'); return;
    }
    if (kind === 'rcpt') {
      r = L.confirmReceipt(S, me, id, val(f, 'qty'));
      if (!r.ok) return showErr(r.error);
      save(); closeSheet(); toast(r.diff < 0 ? '⚠ ' + Math.abs(r.diff) + ' missing at counter' : r.diff > 0 ? '▲ ' + r.diff + ' extra at counter' : '✓ Matches'); render(); return;
    }
    if (kind === 'rcptfix') { r = L.correctReceipt(S, me, id, val(f, 'qty')); if (!r.ok) return showErr(r.error); save(); closeSheet(); toast('Corrected'); render(); return; }
    if (kind === 'edit') { r = L.editEntry(S, me, k, id, val(f, 'qty'), f.elements['f_amount'] ? val(f, 'amount') : undefined); if (!r.ok) return showErr(r.error); save(); closeSheet(); toast('Updated'); render(); return; }
    if (kind === 'del') { r = L.deleteEntry(S, me, k, id); if (!r.ok) return showErr(r.error); save(); closeSheet(); toast('Deleted'); render(); return; }
    if (kind === 'linemistake') { r = L.reportLineMistake(S, me, { shop: f.dataset.shop, date: date, key: f.dataset.key, text: val(f, 'reason') }); if (!r.ok) return showErr(r.error); save(); closeSheet(); toast('Sent to YMR'); render(); return; }
    if (kind === 'reqdel') { r = L.requestDelete(S, me, k, id, val(f, 'reason')); if (!r.ok) return showErr(r.error); save(); closeSheet(); toast('Request sent to YMR'); render(); return; }
    if (kind === 'snew') {
      const lines = [];
      L.SPONGE_FLAVORS.forEach((fl, i) => L.SPONGE_SIZES.forEach((z, j) => { const v = String(val(f, 'q' + i + '_' + j)).trim(); if (v !== '' && v !== '0') lines.push({ type: fl + ' Sponge ' + z, ordered: v }); }));
      r = L.placeSpongeBatch(S, me, { shop: val(f, 'shop'), forDate: val(f, 'date'), lines: lines }, today());
      if (!r.ok) return showErr(r.error);
      date = r.orders[0].forDate; tab = 'sponge'; save(); closeSheet(); toast('Order locked 🔒 — ' + r.total + ' sponges'); render(); return;
    }
    if (kind === 'undo') { r = L.undoProduction(S, me, id, new Date()); if (!r.ok) return showErr(r.error); save(); closeSheet(); toast('Undone'); render(); return; }
    if (kind === 'boardnew') {
      const names = String(val(f, 'names') || '').split(/[\n,;]+/).map(x => x.trim().replace(/\s+/g, ' ')).filter(x => x.length >= 2 && x.length <= 60);
      if (!names.length) return showErr('Write at least one name');
      closeSheet(); (async function () { let n = 0; for (const nm of names) { if (!boardPerson(nm)) { const pr = await boardAddPerson(nm); if (pr) n++; } } boardDraw(); toast(n ? 'Added ' + n + ' name' + (n > 1 ? 's' : '') : 'Those names are already in the list'); })(); return;
    }
    if (kind === 'wkrecv') {
      const rows = []; for (let i = 0; i < 300; i++) { if (!f.elements['f_i' + i]) break; rows.push({ id: val(f, 'i' + i), got: val(f, 'g' + i) }); }
      r = L.receiveWeekly(S, me, rows, today()); if (!r.ok) return showErr(r.error);
      save(); closeSheet(); toast('✓ ' + r.got + ' received' + (r.part ? ' · ' + r.part + ' partly' : '') + (r.missing ? ' · ' + r.missing + ' not received' : '')); render(); return;
    }
    if (kind === 'wsheet') {
      const rows = [];
      L.WEEKLY_PRODUCTS.forEach((n, i) => { const hv = String(val(f, 'h' + i) || '').trim(), nd = String(val(f, 'n' + i) || '').trim(); if (hv || nd) { let cu = ''; try { const ch = f.querySelector('.ws-u[data-i="' + i + '"]'); if (ch) cu = ch.textContent.trim(); } catch (e) { } rows.push({ item: n, have: L.withUnit(hv, n, cu), need: L.withUnit(nd, n, cu) }); } });
      for (let j = 0; j < 120; j++) { if (!f.elements['f_xn' + j]) continue; const nm = String(val(f, 'xn' + j) || '').trim(); if (nm) rows.push({ item: nm, have: val(f, 'xh' + j), need: val(f, 'xd' + j) }); }
      r = L.addWeeklySheet(S, me, { shop: val(f, 'shop'), date: today(), forDate: val(f, 'date'), rows: rows }, today());
      if (!r.ok) return showErr(r.error);
      wkSel = val(f, 'date'); lastShop = val(f, 'shop'); try { localStorage.removeItem(WS_KEY); } catch (e) { } save(); closeSheet(); toast('Saved ' + r.count + (r.count === 1 ? ' item' : ' items') + (r.out ? ' · ' + r.out + ' finished (0)' : '') + (r.skipped.length ? ' · ' + r.skipped.length + ' already on the list' : '')); render(); return;
    }
    if (kind === 'weekly') {
      r = L.addClosingBatch(S, me, { shop: val(f, 'shop'), date: today(), forDate: val(f, 'date'), text: val(f, 'text'), weekly: true }, today());
      if (!r.ok) return showErr(r.error);
      wkSel = val(f, 'date'); lastShop = val(f, 'shop'); save(); toast('Added ' + r.count + (r.count === 1 ? ' line' : ' lines') + ' to the weekly list'); render(); return;
    }
    if (kind === 'closing') {
      r = L.addClosingBatch(S, me, { shop: val(f, 'shop'), date: val(f, 'date'), text: val(f, 'text') }, today());
      if (!r.ok) return showErr(r.error);
      save(); toast('Added ' + r.count + (r.count === 1 ? ' line' : ' lines')); render(); return;
    }
    if (kind === 'recv') {
      r = L.receiveSponge(S, me, id, val(f, 'qty'), today());
      if (!r.ok) return showErr(r.error);
      save(); closeSheet(); toast(r.status.state === 'short' ? '⚠ ' + Math.abs(r.status.diff) + ' short' : r.status.state === 'excess' ? '▲ ' + r.status.diff + ' extra' : '✓ Complete'); render(); return;
    }
    if (kind === 'fix') { r = L.correctReceived(S, me, id, val(f, 'qty')); if (!r.ok) return showErr(r.error); save(); closeSheet(); toast('Corrected'); render(); return; }
    if (kind === 'fclimit') { r = L.setFoodCostLimit(S, me, val(f, 'limit')); if (!r.ok) return showErr(r.error); save(); toast('Limit saved'); render(); return; }
  });

  window.addEventListener('afterprint', function () { try { document.body.classList.remove('printing'); } catch (e) { } });
  window.addEventListener('hashchange', function () { if (!me) render(); });
  (async function boot() {
    try { if (navigator.serviceWorker && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js'); } catch (e) { }
    try { Sync.init(); } catch (e) { loginErr = msgOf(e); render(); return; }
    if (location.hash === '#setup') { render(); return; }
    busy = 'Opening…'; render();
    try { const u = await Sync.session(); if (u) { await startSession(u); return; } } catch (e) { loginErr = msgOf(e); }
    busy = ''; render();
  })();
})();
</script>
</body>
</html>
